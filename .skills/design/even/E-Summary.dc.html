<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>even · Summary</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&amp;display=swap">
<style>
body{margin:0}
a{color:#1E44D8}a:hover{color:#1634A8}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FFFFFF; font-family: 'Archivo', ui-sans-serif, system-ui, sans-serif; color: #0B0F19">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 10px 8px 0">
    <a href="#" style="height: 44px; padding: 0 12px; display: flex; align-items: center; gap: 4px; color: #0B0F19; text-decoration: none; font-size: 15px; font-weight: 600">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
      Bills
    </a>
    <button type="button" aria-label="More actions" style="width: 44px; height: 44px; border: 0; background: transparent; display: grid; place-items: center; cursor: pointer; color: #0B0F19">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg>
    </button>
  </header>

  <div style="padding: 4px 20px 0">
    <h1 style="margin: 0; font-size: 34px; line-height: 1.05; font-weight: 650; font-stretch: 122%; letter-spacing: -0.04em">Ramen Kazu</h1>
    <p style="margin: 6px 0 0; font-size: 15px; color: #4A5163">Sat 4 Oct · paid by you · ¥ 14,820</p>
  </div>

  <section aria-labelledby="s-owed" style="padding: 20px 20px 0">
    <h2 id="s-owed" style="margin: 0; font-size: 15px; font-weight: 600; color: #4A5163">Still owed to you</h2>
    <p style="margin: 0; display: flex; align-items: flex-start; gap: 6px; font-variant-numeric: tabular-nums">
      <span style="font-size: 18px; font-weight: 600; font-stretch: 125%; margin-top: 10px">SGD</span>
      <span style="font-size: 56px; line-height: 1.05; font-weight: 600; font-stretch: 125%; letter-spacing: -0.045em">67.59</span>
    </p>
    <div style="margin-top: 10px; min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-top: 1px solid #E5E8EE; border-bottom: 1px solid #E5E8EE">
      <span style="font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums">1 JPY = 0.00894 SGD</span>
      <span style="display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #4A5163">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
        Locked after first payment
      </span>
    </div>
  </section>

  <ul style="list-style: none; margin: 18px 20px 0; padding: 0; border-top: 1.5px solid #0B0F19">
    <sc-for list="{{people}}" as="p" hint-placeholder-count="5">
      <li style="padding: 10px 0; border-bottom: 1px solid #E5E8EE; display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; column-gap: 12px; row-gap: 2px; align-items: center">
        <span aria-hidden="true" style="grid-row: span 2; width: 30px; height: 30px; border-radius: 999px; display: grid; place-items: center; font-size: 13px; font-weight: 700; background: {{p.bg}}">{{p.initial}}</span>
        <span style="font-size: 16px; font-weight: 600">{{p.name}}</span>
        <span style="font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums">{{p.sgd}}</span>
        <span style="font-size: 14px; color: #4A5163; font-variant-numeric: tabular-nums">{{p.yen}}</span>
        <span style="display: flex; justify-content: flex-end; gap: 14px; font-size: 14px; font-weight: 700">
          <sc-if value="{{p.even}}" hint-placeholder-val="{{false}}">
            <span style="display: flex; align-items: center; gap: 6px; color: #1E44D8">
              <span aria-hidden="true" style="display: flex; flex-direction: column; gap: 3px"><span style="width: 12px; height: 2.5px; background: #1E44D8"></span><span style="width: 12px; height: 2.5px; background: #1E44D8"></span></span>
              Even
            </span>
          </sc-if>
          <sc-if value="{{p.open}}" hint-placeholder-val="{{true}}">
            <a href="#" style="text-decoration: none">Send link</a>
            <a href="#" style="text-decoration: none">Mark paid</a>
          </sc-if>
          <sc-if value="{{p.self}}" hint-placeholder-val="{{false}}">
            <span style="color: #4A5163; font-weight: 600">your share</span>
          </sc-if>
        </span>
      </li>
    </sc-for>
  </ul>

  <a href="#" style="margin: 0 20px; min-height: 48px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #E5E8EE; color: #0B0F19; text-decoration: none; font-size: 15px">
    <span style="font-weight: 600">Items &amp; charges</span>
    <span style="display: flex; align-items: center; gap: 6px; color: #4A5163">8 items · tax incl.<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></span>
  </a>

  <footer style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 12px 20px 24px; background: #FFFFFF; border-top: 1px solid #E5E8EE; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <a href="#" style="height: 52px; border-radius: 6px; border: 1.5px solid #0B0F19; color: #0B0F19; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; text-decoration: none">Edit split</a>
    <a href="#" style="height: 52px; border-radius: 6px; background: #1E44D8; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; text-decoration: none">Send all links</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const p = (name, initial, bg, yen, sgd, state) => ({
      name, initial, bg, yen, sgd,
      even: state === 'even', open: state === 'open', self: state === 'self'
    });
    return {
      people: [
        p('You', 'G', '#CFE3FF', '¥ 3,960', '35.40', 'self'),
        p('Aina', 'A', '#FFDCC7', '¥ 3,300', '29.50', 'even'),
        p('Wei Jie', 'W', '#CDEFE0', '¥ 2,880', '25.75', 'open'),
        p('Priya', 'P', '#E3DBFF', '¥ 2,520', '22.53', 'open'),
        p('Daniel', 'D', '#F3E6C4', '¥ 2,160', '19.31', 'open')
      ]
    };
  }
}
</script>
</body>
</html>
