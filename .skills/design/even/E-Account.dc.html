<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>even · Account</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&amp;display=swap">
<style>
body{margin:0}
a{color:#1E44D8}a:hover{color:#1634A8}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FFFFFF; font-family: 'Archivo', ui-sans-serif, system-ui, sans-serif; color: #0B0F19">

  <div style="padding: 24px 20px 0">
    <h1 style="margin: 0; font-size: 34px; line-height: 1.05; font-weight: 650; font-stretch: 122%; letter-spacing: -0.04em">George</h1>
    <p style="margin: 6px 0 0; font-size: 15px; color: #4A5163">@george · admin</p>
  </div>

  <section aria-labelledby="ac-scans" style="margin: 20px 20px 0">
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <h2 id="ac-scans" style="margin: 0; font-size: 15px; font-weight: 600">Scans this month</h2>
      <span style="font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums">12 of 30</span>
    </div>
    <div role="meter" aria-label="Scans used" aria-valuemin="0" aria-valuemax="30" aria-valuenow="12" style="margin-top: 8px; height: 6px; border-radius: 3px; background: #E5E8EE; overflow: hidden">
      <span style="display: block; width: 40%; height: 100%; background: #1E44D8"></span>
    </div>
  </section>

  <section aria-labelledby="ac-money" style="margin: 26px 20px 0">
    <h2 id="ac-money" style="margin: 0 0 6px; font-size: 18px; font-weight: 700; font-stretch: 115%; letter-spacing: -0.02em">Money</h2>
    <ul style="list-style: none; margin: 0; padding: 0; border-top: 1.5px solid #0B0F19">
      <li style="min-height: 52px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid #E5E8EE">
        <label for="hc" style="font-size: 16px; font-weight: 500">Home currency</label>
        <select id="hc" style="height: 40px; padding: 0 10px; border: 1.5px solid #0B0F19; border-radius: 6px; background: #FFFFFF; font: 600 15px 'Archivo', system-ui, sans-serif; color: #0B0F19">
          <option>SGD — Singapore dollar</option>
        </select>
      </li>
      <li style="min-height: 52px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid #E5E8EE">
        <span style="font-size: 16px; font-weight: 500">How friends pay you</span>
        <a href="#" style="font-size: 15px; font-weight: 600; text-decoration: none">PayNow ···· 4567</a>
      </li>
    </ul>
  </section>

  <section aria-labelledby="ac-rates" style="margin: 26px 20px 0">
    <div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px">
      <h2 id="ac-rates" style="margin: 0; font-size: 18px; font-weight: 700; font-stretch: 115%; letter-spacing: -0.02em">Saved rates</h2>
      <a href="#" style="font-size: 15px; font-weight: 600; text-decoration: none">Add rate</a>
    </div>
    <ul style="list-style: none; margin: 0; padding: 0; border-top: 1.5px solid #0B0F19">
      <sc-for list="{{rates}}" as="r" hint-placeholder-count="3">
        <li style="min-height: 52px; display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 14px; border-bottom: 1px solid #E5E8EE">
          <span style="font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums">1 {{r.base}} = {{r.rate}} SGD</span>
          <span style="font-size: 14px; color: #4A5163">{{r.when}}</span>
          <a href="#" aria-label="{{r.edit}}" style="width: 44px; height: 44px; display: grid; place-items: center; color: #1E44D8">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17v3z"></path><path d="M14 7l3 3"></path></svg>
          </a>
        </li>
      </sc-for>
    </ul>
  </section>

  <section aria-labelledby="ac-sec" style="margin: 26px 20px 0">
    <h2 id="ac-sec" style="margin: 0 0 6px; font-size: 18px; font-weight: 700; font-stretch: 115%; letter-spacing: -0.02em">Sign-in</h2>
    <ul style="list-style: none; margin: 0; padding: 0; border-top: 1.5px solid #0B0F19">
      <li style="min-height: 52px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #E5E8EE">
        <span style="font-size: 16px; font-weight: 500">Password</span>
        <a href="#" style="font-size: 15px; font-weight: 600; text-decoration: none">Change</a>
      </li>
      <li style="min-height: 52px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #E5E8EE">
        <span style="font-size: 16px; font-weight: 500">This device</span>
        <button type="button" style="height: 44px; border: 0; background: transparent; padding: 0; font: 600 15px 'Archivo', system-ui, sans-serif; color: #B42318; cursor: pointer">Sign out</button>
      </li>
    </ul>
  </section>

  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 72px; box-sizing: border-box; padding: 0 20px 14px; background: #FFFFFF; border-top: 1px solid #E5E8EE; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
    <a href="#" style="display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; color: #4A5163; text-decoration: none">Home</a>
    <a href="#" style="display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; color: #4A5163; text-decoration: none">Bills</a>
    <a href="#" style="display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; color: #4A5163; text-decoration: none">People</a>
    <a href="#" aria-current="page" style="display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: #0B0F19; text-decoration: none; box-shadow: inset 0 3px 0 #1E44D8">Me</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      rates: [
        { base: 'MYR', rate: '0.2950', when: '2 Oct', edit: 'Edit MYR rate' },
        { base: 'JPY', rate: '0.00894', when: '4 Oct', edit: 'Edit JPY rate' },
        { base: 'USD', rate: '1.2840', when: '12 Sep', edit: 'Edit USD rate' }
      ]
    };
  }
}
</script>
</body>
</html>
