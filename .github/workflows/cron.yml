# Scheduled jobs against the production API (Render Free sleeps after ~15 min without traffic).
#
# keep-warm   GET /api/health every 10 min from 07:00 to 01:00 Asia/Singapore (UTC+8, no DST):
#               07:00–07:59 SGT = 23:00–23:59 UTC (previous UTC day) → "*/10 23 * * *"
#               08:00–00:59 SGT = 00:00–16:59 UTC                    → "*/10 0-16 * * *"
#             Last ping 00:50 SGT, so the instance sleeps around 01:05 SGT until the first user.
#             Budget: 18 h/day × 31 = 558 of Render's 750 free instance-hours per workspace.
#             /api/health never touches the DB. A failed ping only warns (no 100 failure emails a day);
#             the daily maintenance job is the loud alert.
# maintenance POST /api/internal/maintenance (Bearer CRON_SECRET) daily at 10:23 SGT = 02:23 UTC
#             (inside the warm window, so no extra wake-up hours). Purges receipt photos older than
#             90 days, fails stale scan jobs and runs a DB query. That daily DB activity also stops
#             Supabase Free from pausing the project after 7 days of inactivity.
#
# Notes: schedules run on the default branch only, may start a few minutes late, and GitHub
# disables them after 60 days without repository activity (re-enable in the Actions tab).
# Public repo → Actions minutes are free. On a private repo, ~108 keep-warm runs/day would use
# ~3,300 billed minutes/month (> 2,000 free), so you'd need to thin the schedule.
# Needs: repo variable API_BASE_URL, repo secret CRON_SECRET (same value as on Render).
name: Cron (keep-warm, maintenance)

on:
  schedule:
    - cron: "*/10 23 * * *"   # keep-warm 07:00–07:59 SGT
    - cron: "*/10 0-16 * * *" # keep-warm 08:00–00:59 SGT
    - cron: "23 2 * * *"      # maintenance 10:23 SGT
  workflow_dispatch:
    inputs:
      task:
        description: Which job to run
        type: choice
        options: [maintenance, keep-warm]
        default: maintenance

concurrency:
  group: cron-${{ github.event.schedule == '23 2 * * *' && 'maintenance' || inputs.task || 'keep-warm' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  keep-warm:
    if: >-
      vars.API_BASE_URL != '' &&
      ((github.event_name == 'schedule' && github.event.schedule != '23 2 * * *') ||
       (github.event_name == 'workflow_dispatch' && inputs.task == 'keep-warm'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET /api/health
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 \
            --retry 3 --retry-delay 20 --retry-all-errors "${API_BASE_URL%/}/api/health") || code=000
          echo "GET /api/health → HTTP $code"
          if [ "$code" != "200" ]; then echo "::warning::keep-warm ping returned HTTP $code"; fi

  maintenance:
    if: >-
      vars.API_BASE_URL != '' &&
      ((github.event_name == 'schedule' && github.event.schedule == '23 2 * * *') ||
       (github.event_name == 'workflow_dispatch' && inputs.task == 'maintenance'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate configuration
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Repository secret CRON_SECRET is not set (scripts/provision/github.py)."
            exit 1
          fi

      - name: Warm up the API (cold start can take ~1 min)
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 "${API_BASE_URL%/}/api/health") || code=000
            echo "warm-up $i/6: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "::error::API did not become healthy"
          exit 1

      - name: POST /api/internal/maintenance
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          for attempt in 1 2 3; do
            code=$(curl -sS -o body.json -w '%{http_code}' --max-time 120 -X POST \
              -H "Authorization: Bearer $CRON_SECRET" \
              "${API_BASE_URL%/}/api/internal/maintenance") || code=000
            # The response holds only counts / error codes (no secrets).
            echo "attempt $attempt/3: HTTP $code $(head -c 500 body.json 2>/dev/null)"
            [ "$code" = "200" ] && exit 0
            if [ "$code" = "401" ]; then
              echo "::error::CRON_SECRET differs between GitHub and Render"
              exit 1
            fi
            sleep 30
          done
          echo "::error::maintenance failed after 3 attempts"
          exit 1
