# Deploy the API to Render (free Docker web service `even-api`, Singapore).
# Push to main touching the backend → re-run migrations + tests on Postgres 16 → trigger the
# Render deploy for this exact commit → wait until it is live → smoke test.
# Render auto-deploy is OFF (render.py sets it), so this workflow is the only deploy path and the
# kill switch below really stops deploys.
#
# Kill switch: push deploys run only when the repo variable CLOUD_DEPLOY_ENABLED == 'true'.
# A manual run (workflow_dispatch) is an explicit human action and ignores the switch, but only
# from main (the `production` environment also allows main only).
#
# Needs: environment `production` secrets RENDER_API_KEY + RENDER_SERVICE_ID
#        (or RENDER_DEPLOY_HOOK_URL); repo variables API_BASE_URL, PAGES_URL.
name: Deploy backend (Render)

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "shared/**"
      - "render.yaml"
      - "scripts/provision/render.py"
      - ".github/workflows/deploy-backend-render.yml"
  workflow_dispatch:

concurrency:
  group: render-backend-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Migrations + tests on Postgres 16
    if: github.ref == 'refs/heads/main' && (vars.CLOUD_DEPLOY_ENABLED == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bill_splitter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bill_splitter_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bill_splitter_test
      DATABASE_SSL: disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Migrations apply to an empty database
        run: alembic upgrade head

      - name: Tests
        run: pytest

  deploy:
    name: Deploy to Render + smoke test
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.API_BASE_URL }}/api/health
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check deploy configuration
        env:
          HAS_API: ${{ secrets.RENDER_API_KEY != '' && secrets.RENDER_SERVICE_ID != '' }}
          HAS_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [ "$HAS_API" != "true" ] && [ "$HAS_HOOK" != "true" ]; then
            echo "::error::Set RENDER_API_KEY + RENDER_SERVICE_ID (or RENDER_DEPLOY_HOOK_URL) in the 'production' environment (scripts/provision/github.py)."
            exit 1
          fi
          if [ -z "$API_BASE_URL" ]; then
            echo "::error::Repository variable API_BASE_URL is not set (scripts/provision/github.py)."
            exit 1
          fi

      - name: Trigger the deploy for this commit and wait until live
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: python scripts/provision/render.py deploy --commit "$GITHUB_SHA" --wait --timeout 1500

      - name: Smoke test (health, DB, CORS from the Pages origin, maintenance guard)
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          PAGES_URL: ${{ vars.PAGES_URL }}
        run: python scripts/provision/smoke.py --skip-pages --maintenance-guard
