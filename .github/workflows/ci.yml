name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend · pytest on Postgres 16
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bill_splitter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bill_splitter_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bill_splitter_test
      DATABASE_SSL: disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Migrations apply to an empty database
        run: alembic upgrade head

      - name: Migrations roll back and re-apply
        run: alembic downgrade base && alembic upgrade head

      - name: Tests (incl. shared/split-vectors.json)
        run: pytest

      - name: Production image builds
        working-directory: .
        run: docker build -f backend/Dockerfile.render -t bill-splitter-api:ci backend

  frontend:
    name: Frontend · typecheck, lint, build, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24" # jsdom needs >= 22.22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        # No VITE_* here: the bundle only refuses to *run* in production without Supabase vars.
        run: npm run build

      - name: Unit tests (incl. shared/split-vectors.json parity)
        run: npm test

  e2e:
    name: E2E · Playwright (desktop + Pixel 5)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - name: Throwaway dev .env (fake auth provider, local storage, no real keys)
        run: |
          {
            echo "ENVIRONMENT=development"
            echo "SUPABASE_ADMIN_BACKEND=fake"
            echo "SUPABASE_JWT_SECRET=$(openssl rand -hex 32)"
            echo "DEV_LOGIN_PASSWORD=$(openssl rand -hex 16)"
            echo "CORS_ORIGINS=http://localhost:5173"
            # Every spec signs in as the same seeded users, so the whole suite shares one
            # per-user bucket; 300/min (production) 429s the later specs. Limiting stays on
            # (scan/public/admin limits unchanged); the default limit's 429 is covered by pytest.
            echo "RATE_LIMIT_DEFAULT=6000/minute"
          } > .env

      - name: Start Postgres 16 + API (dev auth routes enabled)
        run: |
          docker compose up -d --build db api
          for _ in $(seq 1 45); do
            curl -fsS http://localhost:8000/api/health >/dev/null && break
            sleep 2
          done
          curl -fsS http://localhost:8000/api/health

      - name: Seed deterministic data
        run: docker compose exec -T api python -m app.cli dev-seed

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies + Chromium
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Playwright (dev server, VITE_AUTH_MODE=dev)
        working-directory: web
        env:
          VITE_AUTH_MODE: dev
        run: npm run e2e

      - name: API logs
        if: failure()
        run: docker compose logs --tail 200 api

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
